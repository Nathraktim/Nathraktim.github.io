<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 - Page Not Found | Raktim Nath Portfolio</title>
    <meta name="description" content="The page you're looking for doesn't exist. Explore Raktim Nath's web development portfolio and find what you need.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="404 - Page Not Found">
    <meta property="og:description" content="The page you're looking for doesn't exist.">
    <meta property="og:type" content="website">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #000;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
        }
        
        .error-code {
            font-size: 150px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.1);
            animation: float 1s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }
        
        .btn {
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 16px;
        }
        
        .btn-primary {
            background: black;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: black;
            border: 2px solid black;
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .suggestions {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
        }
        
        .suggestions h2 {
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .suggestions ul {
            list-style: none;
            padding: 0;
        }
        
        .suggestions li {
            margin-bottom: 12px;
        }
        
        .suggestions a {
            color: black;
            text-decoration: none;
            font-size: 16px;
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
        }
        
        .suggestions a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(5px);
        }
        
        h3 {
            position: relative;
        }
        
        h3 .word-wrapper {
            display: inline-block;
            position: relative;
            transition: margin-right 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            margin-right: 0;
        }
        
        h3:hover .word-wrapper {
            margin-right: 35px;
        }
        
        h3 .hidden-text {
            position: absolute;
            opacity: 0;
            max-width: 0;
            overflow: hidden;
            transition: opacity 0.6s cubic-bezier(0.4, 0.0, 0.2, 1), 
                        max-width 0.6s cubic-bezier(0.4, 0.0, 0.2, 1),
                        transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform: translateX(-5px);
            white-space: nowrap;
            left: 100%;
            top: 0;
        }
        
        h3:hover .hidden-text {
            opacity: 0.2;
            max-width: 100px;
            transform: translateX(0);
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 100px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 16px;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1>Oops! Page Not Found</h1>
        <h3><span class="word-wrapper">What<span class="hidden-text">TF*</span></span> are u looking for?</h3>
        <p>The page you're looking for seems to have vanished into the digital void. Don't worry, even the best developers encounter broken links!</p>
        
        <div class="buttons">
            <a href="/" class="btn btn-primary">← Back to Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
        </div>
    </div>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "404 Error - Page Not Found",
      "description": "The requested page could not be found.",
      "url": "https://nathraktim.github.io/404.html"
    }
    </script>
</body>
</html>
